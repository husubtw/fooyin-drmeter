name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch:
    name: Arch Linux (native Fooyin 0.15.1)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed cmake ninja gtest fooyin clang

      - name: Configure and build (dev preset)
        run: |
          cmake --preset dev
          cmake --build --preset dev

      - name: Run unit and integration tests
        run: |
          ctest --preset dev --output-on-failure

      - name: Verify standalone core build and tests
        run: |
          cmake -B build-core -G Ninja -DDRMETER_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

      - name: Check code formatting
        run: |
          find src tests -type f \( -name '*.h' -o -name '*.cpp' \) -exec clang-format --dry-run --Werror {} +

      - name: Verify drmeter_core isolation
        run: |
          if nm -u build/libdrmeter_core.a | grep -iE 'fooyin|qt|qstring|avcodec|avformat'; then
            echo "ERROR: Forbidden dependency found in libdrmeter_core.a"
            exit 1
          fi

  ubuntu-sdk:
    name: Ubuntu 24.04 (Fooyin 0.15.1 Linux SDK, GCC 13 + Qt 6.4)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
      FOOYIN_SDK_URL: https://github.com/fooyin/fooyin/releases/download/v0.15.1/fooyin-sdk-0.15.1-linux-x64-qt6.4.tar.xz
      FOOYIN_SDK_SHA256: 5b90b16628cdcd8f9a58ad087b03f58da1174948e475ab077d84fd22eeb1b090
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ca-certificates curl xz-utils \
            qt6-base-dev libqt6svg6 libqt6sql6-sqlite \
            libavcodec60 libavfilter9 libavformat60 libavutil58 libswresample4 \
            libicu74 libtag1v5 libarchive13t64 zlib1g libqcoro6core0t64 libqcoro6network0t64 \
            libgtest-dev

      - name: Download and verify Fooyin 0.15.1 Linux SDK
        run: |
          curl --fail --location --output fooyin-sdk.tar.xz "$FOOYIN_SDK_URL"
          echo "${FOOYIN_SDK_SHA256}  fooyin-sdk.tar.xz" | sha256sum -c -
          mkdir -p fooyin-sdk
          tar -xJf fooyin-sdk.tar.xz -C fooyin-sdk --strip-components=1

      - name: Configure, build, and test (dev preset)
        run: |
          cmake --preset dev -DCMAKE_PREFIX_PATH="$PWD/fooyin-sdk"
          cmake --build --preset dev
          ctest --preset dev --output-on-failure

      - name: Verify installed plugin linkage (ldd -r)
        run: |
          cmake --install build --prefix "$PWD/fooyin-sdk"
          ldd -r "$PWD/fooyin-sdk/lib/fooyin/plugins/fyplugin_drmeter.so" > ldd.txt
          cat ldd.txt
          if grep -Eq 'not found|undefined symbol:' ldd.txt; then
            echo "ERROR: Missing dependency or undefined symbol in fyplugin_drmeter.so"
            exit 1
          fi

      - name: Verify .fyplugin bundle packaging
        run: |
          cmake -S . -B build-bundle -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DDRMETER_PACKAGE_BUNDLE=ON \
            -DCMAKE_PREFIX_PATH="$PWD/fooyin-sdk"
          cmake --build build-bundle --target package_plugin
          test -f build-bundle/fooyin-drmeter-linux-x64.fyplugin

  fedora:
    name: Fedora 45 (native fooyin-devel 0.15.1, lib64)
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf -y install gcc-c++ cmake ninja-build qt6-qtbase-devel gtest-devel fooyin-devel

      - name: Configure, build, and test (dev preset)
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev --output-on-failure

      - name: Verify lib64 system install and lib user-override install
        run: |
          cmake --install build --prefix /tmp/sys-stage
          test -f /tmp/sys-stage/lib64/fooyin/plugins/fyplugin_drmeter.so

          cmake -S . -B build-user -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DDRMETER_PLUGIN_INSTALL_DIR=lib/fooyin/plugins
          cmake --build build-user
          cmake --install build-user --prefix /tmp/user-stage
          test -f /tmp/user-stage/lib/fooyin/plugins/fyplugin_drmeter.so
